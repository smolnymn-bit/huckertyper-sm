    const PYTHON_EXPLOIT_CODE = generatePentagonHackCode();

    let currentIndex = 0;

    const totalCodeLength = FULL_TERMINAL_TEXT.length;

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function updateDisplay() {

    function updateCounter() {
        charCounterSpan.innerText = currentIndex;

        if (currentIndex >= totalCodeLength) {
            resetToTerminalPrompt();
            return;
        }
        const nextChar = FULL_TERMINAL_TEXT[currentIndex];
        displayedText += nextChar;
        currentIndex++;
        updateDisplay();
        updateCounter();
        // Автоматическая прокрутка вниз
        if (codeWindow) codeWindow.scrollTop = codeWindow.scrollHeight;
    }

        updateCounter();
        if (codeWindow) codeWindow.scrollTop = codeWindow.scrollHeight;

        commandInput.focus();

            const firstChar = val[0];
            // Очищаем поле
            commandInput.value = '';
            addNextCharacter();
        }
    });

            addNextCharacter();
            commandInput.value = '';

        } else {
            // Игнорируем модификаторы
            if (e.key === 'Backspace' || e.key === 'Delete') e.preventDefault();
        }
    });
    
    // Кнопка "ENTER" дублирует добавление символа
    sendBtn.addEventListener('click', (e) => {
        e.preventDefault();
        addNextCharacter();
        commandInput.value = '';
        commandInput.focus();
    });
    
    // При клике на область терминала (код) - переводим фокус на поле ввода, чтобы открыть клавиатуру на мобилках
    function focusOnInput() {
        commandInput.focus();
        // Небольшая задержка для скролла, чтобы клавиатура не перекрыла полностью
        setTimeout(() => {
            if (codeWindow) {
                codeWindow.scrollTop = codeWindow.scrollHeight;
            }
        }, 100);
    }
    
    const codeWindowDiv = document.getElementById("codeWindow");
    const codeDisplayPre = document.getElementById("codeDisplay");
    codeWindowDiv.addEventListener('click', focusOnInput);
    codeDisplayPre.addEventListener('click', focusOnInput);
    // Также touchstart для мобильных (быстрая реакция)
    codeWindowDiv.addEventListener('touchstart', focusOnInput, { passive: false });
    codeDisplayPre.addEventListener('touchstart', focusOnInput, { passive: false });
    
    // Кнопка сброса работает как обычно, но после сброса фокусируем поле ввода
    resetBtn.addEventListener('click', (e) => {
        e.preventDefault();
        resetToTerminalPrompt();
        commandInput.value = '';
        commandInput.focus();
    });
    
    // Инициализация: выводим только промпт, без кода
    displayedText = TERMINAL_HEADER;
    currentIndex = TERMINAL_HEADER.length;
    updateDisplay();
    updateCounter();
    // Фокусируем поле ввода, чтобы сразу можно было печатать (на десктопе удобно, на мобилке по тапу)
    commandInput.focus();
    
    // Доп. стиль для мобильной панели: она всегда видна, клавиатура её не перекрывает полностью,
    // и пользователь видит, что печатает, в то время как основной терминал скроллится.
    console.log("💚 Green Ghost Terminal ready. Нажимай клавиши или используй поле ввода снизу 💚");
</script>
</body>
